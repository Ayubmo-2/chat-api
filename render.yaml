services:
  # ─── REST API ────────────────────────────────────────────────────────────────
  - type: web
    name: chat-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >
      npm install &&
      npx prisma generate --schema=packages/db/prisma/schema.prisma &&
      npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma &&
      cd apps/api && npm run build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chat-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

  # ─── WebSocket Server ─────────────────────────────────────────────────────────
  - type: web
    name: chat-ws
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >
      npm install &&
      npx prisma generate --schema=packages/db/prisma/schema.prisma &&
      cd apps/ws && npm run build
    startCommand: node apps/ws/dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chat-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

  # ─── Redis ───────────────────────────────────────────────────────────────────
  - type: redis
    name: chat-redis
    plan: free
    ipAllowList: []

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
databases:
  - name: chat-db
    databaseName: chatdb
    user: chatuser
    plan: free
